<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
  </defs>

  <!-- Outer Gradient Border & Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#dn-grad)" stroke-width="3.5" />

  <!-- Subtle Inner Glow Accent -->
  <circle cx="50" cy="14" r="4" fill="#34d399" />

  <!-- Monogram "DN" -->
  <text
    x="31"
    y="41"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="26"
    font-weight="800"
    letter-spacing="-1"
    fill="url(#dn-grad)"
  >
    DN
  </text>
</svg>
